<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tokeniser</title>

 <style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f7fb;
    color: #333;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
}

h1 {
    color: #1e3a5f;
    margin-top: 0;
    margin-bottom: 10px;
}

p {
    color: #555;
    line-height: 1.6;
}

.back-btn {
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    height: 220px;
    padding: 15px;
    border: 1px solid #d0d7e2;
    border-radius: 10px;
    font-family: Consolas, monospace;
    font-size: 14px;
    resize: vertical;
    background: white;
}

textarea:focus {
    outline: none;
    border-color: #2d6cdf;
    box-shadow: 0 0 0 3px rgba(45,108,223,0.15);
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 18px 0;
}

button {
    background: #2d6cdf;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #1f56bb;
}

.stats-row {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.stats-row > div {
    flex: 1;
    background: white;
    padding: 15px;
    border-radius: 10px;
    border-left: 5px solid #2d6cdf;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    font-weight: 600;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

th {
    background: #1e3a5f;
    color: white;
    padding: 14px;
    text-align: left;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eef2f7;
}

tr:nth-child(even) {
    background: #f8fbff;
}

tr:hover {
    background: #eef5ff;
}

.analysis-row {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    align-items: stretch;
}

/* left side (stats) */
.stats-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* right side (graph) */
.graph-col {
    flex: 2;
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

/* stats boxes */
#stats, #originStats {
    background: white;
    padding: 15px;
    border-radius: 10px;
    border-left: 5px solid #2d6cdf;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    font-weight: 600;
}

/* responsive (mobile fix) */
@media (max-width: 800px) {
    .analysis-row {
        flex-direction: column;
    }
}


canvas {
    margin-top: 25px;
    width: 100%;
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}

@media (max-width: 700px) {

    .stats-row {
        flex-direction: column;
    }

    .toolbar {
        flex-direction: column;
    }

    .toolbar button {
        width: 100%;
    }
}

</style>
</head>

<body>



<div class="container">

    <h1> Tokeniser</h1>

    <button class="back-btn"
        onclick="window.location.href='tokeniser.html'">
        ← Back to Home
    </button>

    <p>
        Try the tokeniser for yourself. Built using JavaScript.
        Word origins are referenced from a static lookup table and
        may not be exhaustive.
    </p>

    <p><strong>Enter any code snippet:</strong></p>

    <textarea id="inputText"></textarea>

    <div class="toolbar">
        <button onclick="processText()">Begin Processing</button>
        <button onclick="loadSample()">Sample Code</button>
        <button onclick="plotZipf()">Plot Zipf</button>
        <button onclick="exportCSV()">Export CSV</button>
        <button onclick="clearAll()">Clear</button>
    </div>

    <div class="stats-row">
        <div id="stats">
            Total words: 0 | Unique words: 0
        </div>

        <div id="originStats">
            Latin: 0% | Germanic: 0%
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Word</th>
                <th>Frequency</th>
                <th>Origin</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <canvas id="zipfChart" width="600" height="300"></canvas>

</div>



</div>

<script>

    const originMap = {
  // ---------------- CORE FUNCTIONAL WORDS ----------------
  the: "Germanic",
  if: "Germanic",
  else: "Germanic",
  for: "Germanic",
  in: "Germanic",
  to: "Germanic",
  is: "Germanic",
  be: "Germanic",
  not: "Germanic",
  and: "Germanic",
  or: "Germanic",
  as: "Germanic",
  with: "Germanic",
  from: "Germanic",
  by: "Germanic",
  it: "Germanic",
  this: "Germanic",
  that: "Germanic",
  while: "Germanic",
  when: "Germanic",

  // ---------------- PYTHON / PROGRAM FLOW ----------------
  def: "Latin",
  class: "Latin",
  return: "Latin",
  import: "Latin",
  include: "Latin",
  pass: "Latin",

  // ---------------- DATA / STRUCTURE WORDS ----------------
  function: "Latin",
  variable: "Latin",
  value: "Latin",
  constant: "Latin",
  parameters: "Latin",
  parameter: "Latin",
  type: "Latin",
  string: "Germanic",
  number: "Latin",
  int: "Latin",
  float: "Latin",
  bool: "Latin",
  list: "Germanic",
  dict: "Latin",
  table: "Latin",
  database: "Latin",

  // ---------------- LOGIC / CONTROL FLOW ----------------
  define: "Latin",
  parse: "Latin",
  expression: "Latin",
  state: "Latin",
  status: "Latin",
  error: "Latin",
  assert: "Latin",
  null: "Latin",
  none: "Latin",
  true: "Latin",
  false: "Latin",

  // ---------------- OPERATIONS ----------------
  return: "Latin",
  split: "Germanic",
  append: "Latin",
  store: "Latin",
  print: "Latin",

  // ---------------- CUSTOM / EDGE TOKENS ----------------
  token: "Germanic",
  tokens: "Germanic",
  result: "Latin",
  output: "Latin",
  input: "Latin",
  key: "Germanic",
  value: "Latin",
  name: "Germanic",
  size: "Latin",

  // ---------------- STRUCTURAL WORDS ----------------
  class: "Latin",
  def: "Latin",
  init: "Latin",
  self: "Germanic",
  main: "Latin",

  // ---------------- OTHER / AMBIGUOUS ----------------
  ok: "Other",
  tab: "Other",
  stack: "Other",
  buff: "Other",
  software: "Other"
};



let wordData = [];

// -------------------- TOKENISE --------------------
function processText() {
    const text = document.getElementById("inputText").value;

    let words = text.match(/\w+/g) || [];
    words = words.filter(w => w.length > 1);

    const totalWords = words.length;

    const freq = {};
    for (let w of words) {
        freq[w] = (freq[w] || 0) + 1;
    }

    const entries = Object.entries(freq)
        .sort((a, b) => b[1] - a[1]);

    // origin lookup?
    wordData = entries.map(([word, count]) => {
        const key = word.toLowerCase();
        const origin = originMap[key] || "Unknown";
        return [word, count, origin];
    });

    const uniqueWords = entries.length;

    document.getElementById("stats").innerText =
        `Total words: ${totalWords} | Unique words: ${uniqueWords}`;

    renderTable(wordData);
    updateOriginStats(wordData);
}

// -------------------- TABLE --------------------
function renderTable(data) {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    data.forEach((item, index) => {
        const row = `<tr>
            <td>${index + 1}</td>
            <td>${item[0]}</td>
            <td>${item[1]}</td>
            <td>${item[2]}</td>
        </tr>`;
        tbody.innerHTML += row;
    });
}

function updateOriginStats(data) {
    let total = 0;
    let latin = 0;
    let germanic = 0;

    data.forEach(([word, freq, origin]) => {
        total += freq;

        if (origin === "Latin") {
            latin += freq;
        } else if (origin === "Germanic") {
            germanic += freq;
        }
    });

    const latinPct =
        total ? ((latin / total) * 100).toFixed(1) : 0;

    const germanicPct =
        total ? ((germanic / total) * 100).toFixed(1) : 0;

    document.getElementById("originStats").innerText =
        `Latin: ${latinPct}% | Germanic: ${germanicPct}%`;
}


// -------------------- CLEAR --------------------
function clearAll() {
    document.getElementById("inputText").value = "";
    document.getElementById("tableBody").innerHTML = "";
    document.getElementById("stats").innerText =
        "Total words: 0 | Unique words: 0";
    wordData = [];
    clearChart();
    document.getElementById("originStats").innerText =
    "Latin: 0% | Germanic: 0%";
}

// -------------------- SAMPLE --------------------
function loadSample() {
    document.getElementById("inputText").value = `
class Database:
    def __init__(self, name, size):
        self.name = name
        self.size = size
        self.state = "initialised"
        self.status = "ok"
        self.error = None

    def define(self, key, value):
        assert key != None
        assert value != None

        if self.state == "initialised":
            self.store(key, value)
        else:
            self.error = "database not ready"
            return None

    def store(self, key, value):
        if type(key) == str and type(value) == str:
            self.state = "active"
            return True
        else:
            self.error = "type error"
            return False

    def parse(self, expression):
        if expression == "":
            return "empty expression"

        tokens = expression.split(" ")
        result = []

        for token in tokens:
            if token != "":
                result.append(token)

        return result


def function_example(var, const):
    value = var + const

    if value > 10:
        return value
    else:
        return 0


def main():
    db = Database("testdb", 100)

    db.define("key1", "value1")
    db.define("key2", "value2")

    expr = "parse this expression into tokens"
    result = db.parse(expr)

    for item in result:
        print("token:", item)

    output = function_example(5, 7)

    if output != None:
        print("result:", output)

    return output


# runtime simulation
if __name__ == "__main__":
    main()
`;
}

// -------------------- CSV EXPORT --------------------
function exportCSV() {
    let csv = "Rank,Word,Frequency\n";

    wordData.forEach((row, i) => {
        csv += `${i+1},${row[0]},${row[1]}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "tokeniser_output.csv";
    a.click();
}

// -------------------- ZIPF PLOT --------------------
let chart;

function plotZipf() {
    const canvas = document.getElementById("zipfChart");
    const ctx = canvas.getContext("2d");

    const ranks = wordData.map((_, i) => i + 1);
    const freqs = wordData.map(x => x[1]);

    if (chart) chart.destroy();

    chart = new Chart(ctx, {
        type: "scatter",
        data: {
            datasets: [{
                label: "Zipf Distribution",
                data: ranks.map((r, i) => ({
                    x: r,
                    y: freqs[i]
                }))
            }]
        },
        options: {
            scales: {
                x: { title: { display: true, text: "Rank" } },
                y: { title: { display: true, text: "Frequency" } }
            }
        }
    });
}

// -------------------- CLEAR CHART --------------------
function clearChart() {
    const canvas = document.getElementById("zipfChart");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>

<!-- Chart.js for graphing -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</body>
</html>
